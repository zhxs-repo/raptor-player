[workspace]
members = [
    "crates/raptor-core",
    "crates/raptor-ffmpeg",
    "crates/raptor-render",
    "crates/raptor-audio",
    "crates/raptor-danmaku",
    "crates/raptor-subtitle",
    "crates/raptor-pipeline",
    "crates/raptor-ffi",
]
resolver = "2"

[workspace.dependencies]
# LTS locked
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "filter", "software-scaling", "software-resampling"] }
wgpu = { version = "29", default-features = false, features = ["vulkan", "metal", "gles", "wgsl"] }
cpal = "0.15"
tokio = { version = "1", features = ["sync", "rt"] }
crossbeam-channel = "0.5"

# Common
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = { version = "0.29", features = ["android-native-activity"] }
pollster = "0.4"
thiserror = "1"
aho-corasick = "1.1"
regex = "1"
