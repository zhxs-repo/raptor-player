[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# ── Android cross-compilation ──────────────────────────────────────
#
# NDK r28 @ D:\Devs\android_sdk\ndk\28.2.13676358
# API level 26 (Android 8.0) — libaaudio.so only exists from API 26 on.
#
# Build with cargo-ndk (recommended; auto-places the .so into jniLibs):
#   cargo ndk -t arm64-v8a -o ./dart/raptor_flutter/example/android/app/src/main/jniLibs build --release -p raptor-ffi
#
# Or manually (then copy target\aarch64-linux-android\release\libraptor_ffi.so
# into android/app/src/main/jniLibs/arm64-v8a/ yourself):
#   cargo build --target aarch64-linux-android --release -p raptor-ffi

[target.aarch64-linux-android]
linker = "D:\\Devs\\android_sdk\\ndk\\28.2.13676358\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\aarch64-linux-android26-clang.cmd"

[env]
# FFmpeg for Android: headers + static libs produced by scripts/build_ffmpeg_android.sh.
# raptor-ffmpeg/build.rs picks this up (arch-specific key) and forwards it to
# ffmpeg-sys-next as FFMPEG_DIR. Keep it pointing at the `arm64` tree; add more
# ABIs as sibling directories with their own key.
FFMPEG_DIR_aarch64_linux_android = "D:\\Devs\\github\\dyl-player\\raptor-player\\third_party\\ffmpeg-android\\arm64"

# bindgen runs on the host but must parse FFmpeg headers in the *target's* ABI
# context (type sizes differ between Win64 and aarch64-android). The
# target-suffixed variable keeps this scoped to the Android build -- the
# alternative (setting BINDGEN_EXTRA_CLANG_ARGS globally in [env]) leaks NDK
# sysroot flags into every Windows build and breaks them, which is why the old
# config asked you to comment the block in and out by hand.
# The resource-dir include is required: libclang (which bindgen drives) does not
# add clang's own builtin headers the way the clang driver does, so the sysroot's
# stdint.h fails on `#include <stddef.h>` unless the path is given explicitly.
# The path must be 8.3-style (no "Program Files"): ffmpeg-sys-next splits
# BINDGEN_EXTRA_CLANG_ARGS on whitespace, so a space would truncate it to
# "Files/LLVM/lib/clang/22/include" -- clang then treats the fragment as a
# linker input and still cannot find stddef.h.
BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "--target=aarch64-linux-android26 --sysroot=D:/Devs/android_sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/Progra~1/LLVM/lib/clang/22/include"