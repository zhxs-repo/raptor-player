name: raptor_flutter
description: >
  Flutter plugin for Raptor Player — Android SurfaceView integration with
  ANativeWindow FFI binding, lifecycle management, and video rendering widget.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  raptor_player:
    path: ../raptor_player

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.dylplayer.raptor_flutter
        pluginClass: RaptorFlutterPlugin
      ios:
        pluginClass: RaptorFlutterPlugin
