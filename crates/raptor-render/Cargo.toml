[package]
name = "raptor-render"
version = "0.1.0"
edition = "2021"
description = "Raptor video renderer: wgpu soft-decode rendering + WGSL shaders"

[dependencies]
raptor-core = { path = "../raptor-core" }
raptor-ffmpeg = { path = "../raptor-ffmpeg" }
wgpu = { workspace = true }
pollster = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
raw-window-handle = "0.6"

# winit only drives the desktop self-hosted window. Excluded on Android, where
# the surface comes from Flutter and winit's `android-native-activity` feature
# would leave an unresolvable `android_main` reference in the .so.
[target.'cfg(not(target_os = "android"))'.dependencies]
winit = { workspace = true }
