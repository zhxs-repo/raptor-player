# cbindgen configuration for raptor-ffi
language = "C"
include_guard = "RAPTOR_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not modify. */"
cpp_compat = true

header = """/* raptor.h - Raptor Player C FFI Header
 *
 * Usage:
 *   - Dart/Flutter: use dart:ffi to look up these symbols
 *   - C/C++: link against libraptor_ffi (libraptor.so / raptor.dll) and include this header
 */"""

# 依赖 raptor-ffi 自身的源码，不解析依赖 crate 的公开项
[parse]
parse_deps = false

[export]
include = [
    # 回调类型别名必须显式导出，否则使用它们的函数只能得到
    # Option_XxxCallback 这种不透明 struct，C 侧无法声明回调
    "RaptorEventCallback",
    "RaptorPropertyCallback",
    "RaptorHandle",
    "raptor_create",
    "raptor_destroy",
    "raptor_command",
    "raptor_get_property",
    "raptor_set_property",
    "raptor_observe_property",
    "raptor_unobserve_property",
    "raptor_set_event_callback",
    "raptor_poll_event",
    "raptor_get_texture_id",
    "raptor_set_renderer",
    "raptor_set_surface",
    "raptor_detach_surface",
    "raptor_resize_surface",
    "raptor_free_string",
    "raptor_last_error"
]

[enum]
rename_variants = "ScreamingSnakeCase"
